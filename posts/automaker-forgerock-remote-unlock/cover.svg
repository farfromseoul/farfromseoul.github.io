  <rect x="944" y="222" width="150" height="270" rx="28" fill="#191F28"/>
  <rect x="958" y="250" width="122" height="214" rx="16" fill="#FFFFFF"/>
  <rect x="976" y="276" width="86" height="54" rx="14" fill="#3FB950"/>
  <text x="1019" y="312" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">OPEN</text>
  <rect x="976" y="346" width="86" height="54" rx="14" fill="#D6E8FF"/>
  <text x="1019" y="382" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#1B64DA">START</text>
