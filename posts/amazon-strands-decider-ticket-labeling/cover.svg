  <rect x="842" y="176" width="270" height="96" rx="24" fill="#191F28" opacity="0.10"/>
  <rect x="830" y="160" width="270" height="96" rx="24" fill="#FFFFFF"/>
  <text x="965" y="198" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8B95A1" text-anchor="middle">LLM / 1M</text>
  <text x="965" y="236" font-family="DejaVu Sans Mono, monospace" font-size="32" font-weight="bold" fill="#F04452" text-anchor="middle">$22,200</text>
  <line x1="890" y1="225" x2="1040" y2="225" stroke="#F04452" stroke-width="5" stroke-linecap="round"/>

  <rect x="842" y="306" width="270" height="96" rx="24" fill="#191F28" opacity="0.10"/>
  <rect x="830" y="290" width="270" height="96" rx="24" fill="#FFFFFF"/>
  <text x="965" y="328" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8B95A1" text-anchor="middle">decider / 1M</text>
  <text x="965" y="366" font-family="DejaVu Sans Mono, monospace" font-size="32" font-weight="bold" fill="#1B64DA" text-anchor="middle">$500</text>

  <rect x="842" y="436" width="270" height="96" rx="48" fill="#191F28" opacity="0.10"/>
  <rect x="830" y="420" width="270" height="96" rx="48" fill="#3FB950"/>
  <text x="965" y="482" font-family="DejaVu Sans Mono, monospace" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−98%</text>

  <!-- code chip bottom -->
  <rect x="470" y="580" width="300" height="50" rx="25" fill="#191F28"/>
  <text x="620" y="613" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#FFFFFF" text-anchor="middle">mode: <tspan fill="#3FB950">DECIDER</tspan></text>
