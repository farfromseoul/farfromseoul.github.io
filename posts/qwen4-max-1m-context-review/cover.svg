<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="90" fill="#3182F6" opacity="0.08"/>
  <circle cx="130" cy="590" r="120" fill="#3182F6" opacity="0.07"/>

  <!-- long document scroll (1M context) -->
  <rect x="148" y="168" width="400" height="400" rx="34" fill="#191F28" opacity="0.10"/>
  <rect x="136" y="150" width="400" height="400" rx="34" fill="#FFFFFF"/>
  <rect x="136" y="150" width="400" height="70" rx="34" fill="#3182F6"/>
  <rect x="136" y="190" width="400" height="30" fill="#3182F6"/>
  <circle cx="176" cy="185" r="9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="204" cy="185" r="9" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="232" cy="185" r="9" fill="#FFFFFF" opacity="0.4"/>
  <g fill="#D6E8FF">
    <rect x="176" y="252" width="300" height="16" rx="8"/>
    <rect x="176" y="286" width="250" height="16" rx="8"/>
    <rect x="176" y="320" width="320" height="16" rx="8"/>
    <rect x="176" y="354" width="210" height="16" rx="8"/>
    <rect x="176" y="388" width="290" height="16" rx="8"/>
    <rect x="176" y="422" width="240" height="16" rx="8"/>
  </g>
  <rect x="176" y="470" width="196" height="50" rx="25" fill="#191F28"/>
  <text x="274" y="503" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1M tokens</text>

  <!-- price tag -->
  <g transform="rotate(-8 520 200)">
    <rect x="452" y="128" width="190" height="96" rx="24" fill="#191F28" opacity="0.12" transform="translate(8 10)"/>
    <rect x="452" y="128" width="190" height="96" rx="24" fill="#3FB950"/>
    <circle cx="482" cy="176" r="10" fill="#EAF3FF"/>
    <text x="566" y="172" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$1.5</text>
    <text x="566" y="204" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">/ 1M in</text>
  </g>

  <!-- bar chart panel -->
  <rect x="682" y="218" width="420" height="330" rx="34" fill="#191F28" opacity="0.10"/>
  <rect x="670" y="200" width="420" height="330" rx="34" fill="#FFFFFF"/>
  <line x1="710" y1="480" x2="1050" y2="480" stroke="#D6E8FF" stroke-width="6" stroke-linecap="round"/>
  <rect x="730" y="300" width="56" height="180" rx="14" fill="#D6E8FF"/>
  <rect x="810" y="270" width="56" height="210" rx="14" fill="#D6E8FF"/>
  <rect x="890" y="330" width="56" height="150" rx="14" fill="#3182F6"/>
  <rect x="970" y="250" width="56" height="230" rx="14" fill="#D6E8FF"/>
  <rect x="868" y="240" width="100" height="44" rx="22" fill="#1B64DA"/>
  <text x="918" y="270" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">43</text>

  <!-- slow clock chip -->
  <rect x="790" y="88" width="250" height="78" rx="39" fill="#191F28" opacity="0.12" transform="translate(6 8)"/>
  <rect x="790" y="88" width="250" height="78" rx="39" fill="#FFFFFF"/>
  <circle cx="832" cy="127" r="24" fill="#F04452"/>
  <line x1="832" y1="127" x2="832" y2="111" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="832" y1="127" x2="844" y2="134" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <text x="940" y="137" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#191F28" text-anchor="middle">54 tok/s</text>

  <!-- MoE chip -->
  <rect x="690" y="570" width="300" height="60" rx="30" fill="#191F28"/>
  <circle cx="726" cy="600" r="8" fill="#3FB950"/>
  <circle cx="750" cy="600" r="8" fill="#3182F6"/>
  <circle cx="774" cy="600" r="8" fill="#3182F6" opacity="0.4"/>
  <text x="880" y="609" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MoE 2.4T</text>
</svg>
