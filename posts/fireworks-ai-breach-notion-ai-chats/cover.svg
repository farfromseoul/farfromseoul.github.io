<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="120" cy="590" r="170" fill="#FFFFFF" opacity="0.4"/>

  <!-- connectors -->
  <path d="M330 340 H470" stroke="#3182F6" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 26"/>
  <path d="M730 340 H780" stroke="#1B64DA" stroke-width="14" stroke-linecap="round"/>
  <path d="M830 340 H870" stroke="#1B64DA" stroke-width="14" stroke-linecap="round"/>
  <!-- broken link marks -->
  <path d="M792 312 L818 368" stroke="#F04452" stroke-width="10" stroke-linecap="round"/>
  <path d="M808 300 L800 285 M822 306 L834 294" stroke="#F04452" stroke-width="7" stroke-linecap="round"/>

  <!-- App card (left) -->
  <rect x="98" y="218" width="240" height="260" rx="34" fill="#191F28" opacity="0.10"/>
  <rect x="86" y="204" width="240" height="260" rx="34" fill="#FFFFFF"/>
  <rect x="86" y="204" width="240" height="56" rx="28" fill="#3182F6"/>
  <rect x="86" y="232" width="240" height="28" fill="#3182F6"/>
  <circle cx="118" cy="232" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="142" cy="232" r="8" fill="#FFFFFF" opacity="0.6"/>
  <!-- chat bubbles -->
  <rect x="112" y="284" width="150" height="40" rx="20" fill="#EAF3FF"/>
  <rect x="152" y="340" width="150" height="40" rx="20" fill="#3182F6"/>
  <rect x="112" y="396" width="120" height="40" rx="20" fill="#EAF3FF"/>
  <rect x="130" y="300" width="96" height="8" rx="4" fill="#3182F6" opacity="0.5"/>
  <rect x="170" y="356" width="110" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="130" y="412" width="70" height="8" rx="4" fill="#3182F6" opacity="0.5"/>

  <!-- Vendor server (middle) -->
  <rect x="492" y="198" width="240" height="290" rx="34" fill="#191F28" opacity="0.10"/>
  <rect x="480" y="184" width="240" height="290" rx="34" fill="#FFFFFF"/>
  <rect x="510" y="218" width="180" height="62" rx="18" fill="#EAF3FF"/>
  <rect x="510" y="298" width="180" height="62" rx="18" fill="#EAF3FF"/>
  <rect x="510" y="378" width="180" height="62" rx="18" fill="#EAF3FF"/>
  <circle cx="540" cy="249" r="9" fill="#3FB950"/>
  <circle cx="540" cy="329" r="9" fill="#3FB950"/>
  <circle cx="540" cy="409" r="9" fill="#F04452"/>
  <rect x="566" y="244" width="100" height="10" rx="5" fill="#3182F6" opacity="0.55"/>
  <rect x="566" y="324" width="100" height="10" rx="5" fill="#3182F6" opacity="0.55"/>
  <rect x="566" y="404" width="100" height="10" rx="5" fill="#3182F6" opacity="0.55"/>

  <!-- leaking documents from vendor -->
  <g transform="rotate(-12 620 560)">
    <rect x="560" y="520" width="92" height="112" rx="14" fill="#191F28" opacity="0.10"/>
    <rect x="552" y="512" width="92" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="570" y="536" width="56" height="8" rx="4" fill="#F04452"/>
    <rect x="570" y="556" width="56" height="8" rx="4" fill="#3182F6" opacity="0.5"/>
    <rect x="570" y="576" width="40" height="8" rx="4" fill="#3182F6" opacity="0.5"/>
  </g>
  <g transform="rotate(14 730 560)">
    <rect x="690" y="520" width="80" height="98" rx="14" fill="#191F28" opacity="0.10"/>
    <rect x="682" y="512" width="80" height="98" rx="14" fill="#FFFFFF"/>
    <rect x="698" y="534" width="48" height="8" rx="4" fill="#F04452"/>
    <rect x="698" y="554" width="48" height="8" rx="4" fill="#3182F6" opacity="0.5"/>
  </g>

  <!-- Cloud (right) -->
  <g>
    <path d="M912 420 h200 a60 60 0 0 0 0 -120 a80 80 0 0 0 -150 -30 a60 60 0 0 0 -50 150 z" fill="#191F28" opacity="0.10" transform="translate(12 14)"/>
    <path d="M912 420 h200 a60 60 0 0 0 0 -120 a80 80 0 0 0 -150 -30 a60 60 0 0 0 -50 150 z" fill="#1B64DA"/>
    <!-- warning badge -->
    <circle cx="1022" cy="352" r="38" fill="#FFFFFF"/>
    <rect x="1016" y="328" width="12" height="32" rx="6" fill="#F04452"/>
    <circle cx="1022" cy="374" r="7" fill="#F04452"/>
  </g>

  <!-- chips -->
  <rect x="86" y="96" width="232" height="58" rx="29" fill="#191F28"/>
  <text x="202" y="134" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#FFFFFF">sub-processor</text>

  <rect x="480" y="96" width="240" height="58" rx="29" fill="#F04452"/>
  <text x="600" y="134" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#FFFFFF">breach ×2</text>

  <rect x="860" y="500" width="250" height="58" rx="29" fill="#3FB950"/>
  <text x="985" y="538" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#FFFFFF">rotate keys</text>

  <rect x="140" y="520" width="150" height="58" rx="29" fill="#FFFFFF"/>
  <text x="215" y="558" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#1B64DA">&lt;1%</text>
</svg>
