  <rect x="972" y="206" width="72" height="72" rx="20" fill="#3182F6"/>
  <text x="1008" y="254" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{}</text>

  <rect x="784" y="364" width="300" height="140" rx="26" fill="#191F28" opacity="0.12"/>
  <rect x="772" y="350" width="300" height="140" rx="26" fill="#FFFFFF"/>
  <text x="808" y="406" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#191F28">FLASH</text>
  <text x="808" y="450" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#4E5968">quick fixes</text>
  <path d="M1018 378 L992 424 L1012 424 L1000 464 L1036 410 L1014 410 Z" fill="#F04452"/>

  <!-- benchmark chip -->
