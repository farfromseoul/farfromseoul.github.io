  <path d="M400 150 L400 112 A38 38 0 0 1 476 112" fill="none" stroke="#1B64DA" stroke-width="14" stroke-linecap="round"/>
  <rect x="384" y="158" width="128" height="104" rx="22" fill="#191F28" opacity="0.10"/>
  <rect x="372" y="146" width="128" height="104" rx="22" fill="#F04452"/>
  <circle cx="436" cy="188" r="13" fill="#FFFFFF"/>
  <rect x="430" y="192" width="12" height="30" rx="6" fill="#FFFFFF"/>

