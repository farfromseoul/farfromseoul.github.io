<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#3182F6" opacity="0.07"/>
  <circle cx="120" cy="600" r="170" fill="#1B64DA" opacity="0.06"/>

  <!-- terminal window -->
  <rect x="128" y="168" width="560" height="380" rx="28" fill="#191F28" opacity="0.12"/>
  <rect x="110" y="150" width="560" height="380" rx="28" fill="#191F28"/>
  <rect x="110" y="150" width="560" height="62" rx="28" fill="#2B3440"/>
  <rect x="110" y="184" width="560" height="28" fill="#2B3440"/>
  <circle cx="152" cy="181" r="10" fill="#F04452"/>
  <circle cx="186" cy="181" r="10" fill="#FFC342"/>
  <circle cx="220" cy="181" r="10" fill="#3FB950"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="26">
    <text x="150" y="268" fill="#8B95A1">model:</text>
    <text x="252" y="268" fill="#7DB4FF">"hydrogen"</text>
    <text x="150" y="318" fill="#8B95A1">thinking:</text>
    <text x="300" y="318" fill="#F04452" text-decoration="line-through">MEDIUM</text>
    <text x="420" y="318" fill="#3FB950">HIGH</text>
    <text x="150" y="368" fill="#8B95A1">budget:</text>
    <text x="268" y="368" fill="#F04452">400 ✕</text>
    <text x="150" y="418" fill="#8B95A1">tests</text>
    <rect x="240" y="398" width="300" height="24" rx="12" fill="#2B3440"/>
    <rect x="240" y="398" width="240" height="24" rx="12" fill="#3FB950"/>
    <text x="150" y="478" fill="#3182F6">$ run --fast</text>
    <rect x="352" y="456" width="16" height="28" fill="#EAF3FF"/>
  </g>

  <!-- speed gauge -->
  <circle cx="908" cy="352" r="168" fill="#1B64DA" opacity="0.12"/>
  <circle cx="896" cy="340" r="168" fill="#FFFFFF"/>
  <path d="M 766 400 A 140 140 0 0 1 1026 400" fill="none" stroke="#D6E8FF" stroke-width="30" stroke-linecap="round"/>
  <path d="M 766 400 A 140 140 0 0 1 990 252" fill="none" stroke="#3182F6" stroke-width="30" stroke-linecap="round"/>
  <line x1="896" y1="380" x2="980" y2="282" stroke="#191F28" stroke-width="12" stroke-linecap="round"/>
  <circle cx="896" cy="380" r="20" fill="#191F28"/>
  <!-- bolt -->
  <path d="M 900 408 L 872 456 L 894 456 L 880 494 L 926 440 L 904 440 L 920 408 Z" fill="#F04452"/>

  <!-- chips -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="30">
    <rect x="726" y="96" width="150" height="58" rx="29" fill="#3182F6"/>
    <text x="801" y="135" fill="#FFFFFF" text-anchor="middle">xhigh</text>
    <rect x="900" y="96" width="118" height="58" rx="29" fill="#191F28"/>
    <text x="959" y="135" fill="#FFFFFF" text-anchor="middle">1M</text>
    <rect x="740" y="556" width="176" height="58" rx="29" fill="#3FB950"/>
    <text x="828" y="595" fill="#FFFFFF" text-anchor="middle">2.5×</text>
    <rect x="940" y="556" width="176" height="58" rx="29" fill="#1B64DA"/>
    <text x="1028" y="595" fill="#FFFFFF" text-anchor="middle">$1.50</text>
  </g>
</svg>
