  <rect x="918" y="364" width="144" height="52" rx="14" fill="#FDE3E6"/>
  <circle cx="942" cy="262" r="8" fill="#3FB950"/><circle cx="942" cy="326" r="8" fill="#3FB950"/><circle cx="942" cy="390" r="8" fill="#F04452"/>
  <rect x="962" y="256" width="80" height="12" rx="6" fill="#3182F6" opacity="0.5"/>
  <rect x="962" y="320" width="80" height="12" rx="6" fill="#3182F6" opacity="0.5"/>
  <rect x="962" y="384" width="80" height="12" rx="6" fill="#F04452" opacity="0.6"/>

