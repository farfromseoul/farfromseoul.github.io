<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="70" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="120" cy="590" r="90" fill="#FFFFFF" opacity="0.45"/>

  <!-- Bloated DB (left) -->
  <ellipse cx="330" cy="560" rx="200" ry="22" fill="#191F28" opacity="0.10"/>
  <rect x="150" y="190" width="360" height="340" fill="#9CC3FA"/>
  <ellipse cx="330" cy="530" rx="180" ry="44" fill="#9CC3FA"/>
  <rect x="150" y="190" width="360" height="340" fill="#9CC3FA"/>
  <ellipse cx="330" cy="190" rx="180" ry="44" fill="#C7DDFC"/>
  <ellipse cx="330" cy="530" rx="180" ry="44" fill="#9CC3FA"/>
  <!-- rows with holes -->
  <g>
    <rect x="200" y="260" width="260" height="30" rx="15" fill="#3182F6"/>
    <rect x="200" y="310" width="110" height="30" rx="15" fill="#3182F6"/>
    <rect x="325" y="310" width="135" height="30" rx="15" fill="none" stroke="#1B64DA" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="200" y="360" width="140" height="30" rx="15" fill="none" stroke="#1B64DA" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="355" y="360" width="105" height="30" rx="15" fill="#3182F6"/>
    <rect x="200" y="410" width="260" height="30" rx="15" fill="none" stroke="#1B64DA" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="200" y="460" width="180" height="30" rx="15" fill="#3182F6"/>
  </g>
  <!-- bloat badge -->
  <rect x="160" y="110" width="150" height="48" rx="24" fill="#F04452"/>
  <text x="235" y="142" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">bloat</text>

  <!-- Arrow -->
  <g>
    <rect x="555" y="335" width="110" height="30" rx="15" fill="#191F28"/>
    <path d="M655 315 L705 350 L655 385 Z" fill="#191F28" stroke="#191F28" stroke-width="8" stroke-linejoin="round"/>
    <rect x="520" y="250" width="220" height="52" rx="26" fill="#FFFFFF"/>
    <text x="630" y="285" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#1B64DA" text-anchor="middle">REPACK</text>
  </g>

  <!-- Compact DB (right) -->
  <ellipse cx="910" cy="560" rx="150" ry="20" fill="#191F28" opacity="0.10"/>
  <rect x="780" y="330" width="260" height="200" fill="#3182F6"/>
  <ellipse cx="910" cy="530" rx="130" ry="34" fill="#3182F6"/>
  <ellipse cx="910" cy="330" rx="130" ry="34" fill="#6AA6F8"/>
  <rect x="820" y="390" width="180" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="820" y="430" width="180" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="820" y="470" width="120" height="26" rx="13" fill="#FFFFFF"/>

  <!-- unlocked / online chip -->
  <rect x="770" y="200" width="290" height="56" rx="28" fill="#3FB950"/>
  <circle cx="808" cy="228" r="14" fill="#FFFFFF"/>
  <path d="M801 228 L807 234 L816 222" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="935" y="237" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONCURRENTLY</text>

  <!-- version chip -->
  <rect x="960" y="560" width="160" height="60" rx="30" fill="#191F28"/>
  <text x="1040" y="600" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">PG 19</text>
</svg>
