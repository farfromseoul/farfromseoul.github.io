<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#3182F6" opacity="0.07"/>
  <circle cx="120" cy="600" r="180" fill="#1B64DA" opacity="0.06"/>

  <!-- three tier bars -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold">
    <!-- shadows -->
    <rect x="148" y="448" width="230" height="110" rx="26" fill="#191F28" opacity="0.10"/>
    <rect x="408" y="318" width="230" height="240" rx="26" fill="#191F28" opacity="0.10"/>
    <rect x="668" y="208" width="230" height="350" rx="26" fill="#191F28" opacity="0.10"/>
    <!-- Hydrogen -->
    <rect x="140" y="438" width="230" height="110" rx="26" fill="#FFFFFF"/>
    <text x="255" y="493" font-size="40" fill="#3182F6" text-anchor="middle">H</text>
    <text x="255" y="530" font-size="22" fill="#191F28" text-anchor="middle" font-weight="normal">$1.5 / $7.5</text>
    <!-- Neon highlighted -->
    <rect x="400" y="308" width="230" height="240" rx="26" fill="#3182F6"/>
    <text x="515" y="400" font-size="64" fill="#FFFFFF" text-anchor="middle">Ne</text>
    <text x="515" y="452" font-size="28" fill="#FFFFFF" text-anchor="middle">$3 / $15</text>
    <rect x="455" y="478" width="120" height="40" rx="20" fill="#3FB950"/>
    <text x="515" y="506" font-size="20" fill="#FFFFFF" text-anchor="middle">1M ctx</text>
    <!-- Carbon -->
    <rect x="660" y="198" width="230" height="350" rx="26" fill="#191F28"/>
    <text x="775" y="300" font-size="56" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="775" y="350" font-size="22" fill="#9FC3FF" text-anchor="middle" font-weight="normal">~11.30  $2 / $10</text>
    <line x1="684" y1="342" x2="866" y2="342" stroke="#F04452" stroke-width="4" stroke-linecap="round"/>
    <text x="775" y="392" font-size="24" fill="#FFFFFF" text-anchor="middle">12.1~ $4 / $20</text>
    <path d="M745 430 l30 -26 l30 26" fill="none" stroke="#F04452" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M745 462 l30 -26 l30 26" fill="none" stroke="#F04452" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <!-- base line -->
    <rect x="120" y="556" width="790" height="12" rx="6" fill="#1B64DA" opacity="0.35"/>
  </g>

  <!-- calendar chip -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold">
    <rect x="958" y="258" width="170" height="180" rx="28" fill="#191F28" opacity="0.10"/>
    <rect x="950" y="250" width="170" height="180" rx="28" fill="#FFFFFF"/>
    <path d="M950 278 a28 28 0 0 1 28 -28 h114 a28 28 0 0 1 28 28 v32 h-170 z" fill="#F04452"/>
    <text x="1035" y="296" font-size="26" fill="#FFFFFF" text-anchor="middle">DEC</text>
    <text x="1035" y="400" font-size="76" fill="#191F28" text-anchor="middle">1</text>
    <rect x="985" y="232" width="12" height="36" rx="6" fill="#1B64DA"/>
    <rect x="1073" y="232" width="12" height="36" rx="6" fill="#1B64DA"/>
  </g>

  <!-- thinking level dial -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold">
    <rect x="958" y="478" width="170" height="80" rx="40" fill="#191F28" opacity="0.10"/>
    <rect x="950" y="470" width="170" height="80" rx="40" fill="#FFFFFF"/>
    <circle cx="990" cy="510" r="12" fill="#D6E8FF"/>
    <circle cx="1025" cy="510" r="12" fill="#D6E8FF"/>
    <circle cx="1060" cy="510" r="12" fill="#3182F6"/>
    <circle cx="1095" cy="510" r="12" fill="#D6E8FF"/>
    <text x="1060" y="540" font-size="14" fill="#1B64DA" text-anchor="middle">high</text>
  </g>

  <!-- code chip -->
  <g font-family="DejaVu Sans Mono, monospace">
    <rect x="148" y="118" width="420" height="78" rx="20" fill="#191F28" opacity="0.10"/>
    <rect x="140" y="110" width="420" height="78" rx="20" fill="#191F28"/>
    <circle cx="176" cy="149" r="9" fill="#F04452"/>
    <circle cx="204" cy="149" r="9" fill="#3FB950"/>
    <text x="232" y="160" font-size="28" fill="#FFFFFF">cost/task <tspan fill="#3FB950">-32%</tspan></text>
  </g>
</svg>
