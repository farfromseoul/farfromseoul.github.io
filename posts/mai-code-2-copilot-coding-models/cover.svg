  <rect x="216" y="438" width="190" height="48" rx="24" fill="#3FB950"/>
  <text x="311" y="470" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓ tests pass</text>

  <!-- two model cards (big / flash) -->
  <rect x="784" y="190" width="300" height="140" rx="26" fill="#191F28" opacity="0.12"/>
  <rect x="772" y="176" width="300" height="140" rx="26" fill="#1B64DA"/>
