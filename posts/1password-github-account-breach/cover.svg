  <rect x="500" y="490" width="220" height="50" rx="25" fill="#F04452"/>
  <text x="610" y="523" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#FFFFFF" text-anchor="middle">6 → 10 chars</text>
