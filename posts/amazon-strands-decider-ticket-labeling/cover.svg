  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="100" r="150" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="110" cy="610" r="170" fill="#FFFFFF" opacity="0.3"/>

  <!-- ticket stack (left) -->
  <g>
