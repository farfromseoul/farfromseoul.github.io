<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="70" r="140" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="80" cy="620" r="150" fill="#FFFFFF" opacity="0.3"/>

  <!-- permission prompt card -->
  <rect x="96" y="96" width="420" height="190" rx="28" fill="#191F28" opacity="0.10"/>
  <rect x="80" y="80" width="420" height="190" rx="28" fill="#FFFFFF"/>
  <text x="112" y="130" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#191F28">Run this command?</text>
  <rect x="112" y="150" width="356" height="40" rx="12" fill="#EAF3FF"/>
  <text x="126" y="177" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#1B64DA">PGPASSWORD=•••• psql</text>
  <rect x="112" y="208" width="356" height="44" rx="22" fill="#3182F6"/>
  <circle cx="140" cy="230" r="11" fill="#FFFFFF"/>
  <path d="M 134 230 L 139 235 L 147 225" stroke="#3182F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="162" y="238" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Yes, don't ask again</text>

  <!-- arrow down to file -->
  <path d="M 290 290 L 290 336" stroke="#1B64DA" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round" fill="none"/>
  <path d="M 278 330 L 290 346 L 302 330" stroke="#1B64DA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- settings file -->
  <rect x="96" y="372" width="560" height="230" rx="28" fill="#191F28" opacity="0.10"/>
  <rect x="80" y="356" width="560" height="230" rx="28" fill="#191F28"/>
  <rect x="80" y="356" width="560" height="52" rx="28" fill="#FFFFFF" opacity="0.06"/>
  <text x="112" y="390" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8FB8FF">.claude/settings.local.json</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="21">
    <text x="112" y="446" fill="#FFFFFF">"allow": [</text>
    <text x="140" y="486" fill="#3FB950">"Bash(PGPASSWORD=</text>
    <rect x="364" y="463" width="128" height="32" rx="10" fill="#F04452"/>
    <text x="376" y="486" fill="#FFFFFF">hunter2!</text>
    <text x="498" y="486" fill="#3FB950">…)"</text>
    <text x="140" y="526" fill="#3FB950">"Bash(sshpass -p …)"</text>
    <text x="112" y="564" fill="#FFFFFF">]</text>
  </g>

  <!-- dashed path to repo -->
  <path d="M 660 470 C 730 470, 740 360, 800 330" stroke="#1B64DA" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" fill="none"/>
  <rect x="664" y="500" width="150" height="42" rx="21" fill="#FFFFFF"/>
  <text x="739" y="528" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#191F28" text-anchor="middle">git push</text>

  <!-- public repo box with branch icon -->
  <rect x="836" y="188" width="300" height="250" rx="32" fill="#191F28" opacity="0.10"/>
  <rect x="820" y="172" width="300" height="250" rx="32" fill="#FFFFFF"/>
  <g stroke="#3182F6" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 920 230 L 920 350"/>
    <path d="M 1010 250 C 1010 300, 920 290, 920 330"/>
  </g>
  <circle cx="920" cy="230" r="18" fill="#3182F6"/>
  <circle cx="920" cy="360" r="18" fill="#3182F6"/>
  <circle cx="1010" cy="240" r="18" fill="#1B64DA"/>
  <!-- unlocked padlock -->
  <rect x="1030" y="320" width="64" height="54" rx="12" fill="#F04452"/>
  <path d="M 1044 320 L 1044 304 C 1044 284, 1072 280, 1078 298" stroke="#F04452" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="1062" cy="344" r="7" fill="#FFFFFF"/>
  <rect x="1059" y="346" width="6" height="14" rx="3" fill="#FFFFFF"/>
  <rect x="852" y="388" width="110" height="20" rx="10" fill="#EAF3FF"/>
  <text x="907" y="404" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#1B64DA" text-anchor="middle">PUBLIC</text>

  <!-- number chips -->
  <rect x="830" y="470" width="290" height="64" rx="32" fill="#F04452"/>
  <text x="975" y="513" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2,539 secrets</text>
  <rect x="860" y="552" width="230" height="48" rx="24" fill="#191F28"/>
  <text x="975" y="584" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#FFFFFF" text-anchor="middle">1,994 repos</text>
</svg>
