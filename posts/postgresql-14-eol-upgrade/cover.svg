<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="100" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="110" cy="600" r="170" fill="#FFFFFF" opacity="0.4"/>

  <!-- Old DB cylinder (14) -->
  <g transform="translate(300 330)">
    <g transform="translate(14 16)" opacity="0.10" fill="#191F28">
      <rect x="-130" y="-120" width="260" height="250" rx="10"/>
      <ellipse cx="0" cy="130" rx="130" ry="40"/>
      <ellipse cx="0" cy="-120" rx="130" ry="40"/>
    </g>
    <rect x="-130" y="-120" width="260" height="250" fill="#8B95A1"/>
    <ellipse cx="0" cy="130" rx="130" ry="40" fill="#8B95A1"/>
    <path d="M-130 -38 A130 40 0 0 0 130 -38" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
    <path d="M-130 46 A130 40 0 0 0 130 46" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
    <ellipse cx="0" cy="-120" rx="130" ry="40" fill="#B0B8C1"/>
    <text x="0" y="40" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="96" font-weight="700" fill="#FFFFFF">14</text>
  </g>
  <!-- EOL tag -->
  <g transform="rotate(-10 230 170)">
    <rect x="150" y="140" width="170" height="64" rx="32" fill="#F04452"/>
    <text x="235" y="185" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="34" font-weight="700" fill="#FFFFFF">EOL</text>
  </g>

  <!-- Arrow -->
  <g fill="#3182F6">
    <rect x="480" y="318" width="150" height="28" rx="14"/>
    <path d="M620 290 L690 332 L620 374 Z" stroke="#3182F6" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <rect x="452" y="400" width="268" height="52" rx="26" fill="#191F28"/>
  <text x="586" y="435" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="700" fill="#FFFFFF">pg_upgrade -c</text>

  <!-- New DB cylinder (18) -->
  <g transform="translate(880 330)">
    <g transform="translate(14 16)" opacity="0.10" fill="#191F28">
      <rect x="-130" y="-120" width="260" height="250"/>
      <ellipse cx="0" cy="130" rx="130" ry="40"/>
      <ellipse cx="0" cy="-120" rx="130" ry="40"/>
    </g>
    <rect x="-130" y="-120" width="260" height="250" fill="#3182F6"/>
    <ellipse cx="0" cy="130" rx="130" ry="40" fill="#3182F6"/>
    <path d="M-130 -38 A130 40 0 0 0 130 -38" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.5"/>
    <path d="M-130 46 A130 40 0 0 0 130 46" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.5"/>
    <ellipse cx="0" cy="-120" rx="130" ry="40" fill="#1B64DA"/>
    <text x="0" y="40" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="96" font-weight="700" fill="#FFFFFF">18</text>
  </g>
  <!-- check badge -->
  <circle cx="1018" cy="208" r="44" fill="#191F28" opacity="0.10" transform="translate(6 8)"/>
  <circle cx="1018" cy="208" r="44" fill="#3FB950"/>
  <path d="M996 208 L1012 224 L1040 192" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- date chip -->
  <rect x="470" y="520" width="260" height="60" rx="30" fill="#FFFFFF"/>
  <rect x="494" y="537" width="30" height="26" rx="6" fill="none" stroke="#F04452" stroke-width="4"/>
  <line x1="494" y1="545" x2="524" y2="545" stroke="#F04452" stroke-width="4"/>
  <text x="540" y="561" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#191F28">2026.11.12</text>
  <!-- version chip -->
  <rect x="140" y="540" width="190" height="50" rx="25" fill="#FFFFFF"/>
  <text x="235" y="573" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="700" fill="#191F28">14.25</text>
</svg>
