  <!-- code lines -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="22">
    <text x="176" y="236" fill="#8B95A1">1</text>
    <text x="216" y="236" fill="#1B64DA">def</text><text x="270" y="236" fill="#191F28">refactor(repo):</text>
    <text x="176" y="282" fill="#8B95A1">2</text>
    <text x="246" y="282" fill="#191F28">fix(bugs)</text>
    <text x="176" y="328" fill="#8B95A1">3</text>
    <text x="246" y="328" fill="#191F28">run(tests)</text>
  </g>
  <rect x="216" y="356" width="300" height="18" rx="9" fill="#D6E8FF"/>
  <rect x="216" y="392" width="220" height="18" rx="9" fill="#D6E8FF"/>
