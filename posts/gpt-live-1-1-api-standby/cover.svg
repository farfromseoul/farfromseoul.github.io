<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="70" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="130" cy="580" r="90" fill="#FFFFFF" opacity="0.45"/>

  <!-- microphone -->
  <rect x="308" y="148" width="140" height="240" rx="70" fill="#191F28" opacity="0.12"/>
  <rect x="290" y="130" width="140" height="240" rx="70" fill="#3182F6"/>
  <rect x="318" y="170" width="84" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  <rect x="318" y="200" width="84" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  <rect x="318" y="230" width="84" height="12" rx="6" fill="#FFFFFF" opacity="0.5"/>
  <path d="M250 290 Q250 430 360 430 Q470 430 470 290" fill="none" stroke="#1B64DA" stroke-width="22" stroke-linecap="round"/>
  <rect x="348" y="430" width="24" height="70" fill="#1B64DA"/>
  <rect x="290" y="495" width="140" height="26" rx="13" fill="#191F28"/>

  <!-- sound waves -->
  <g fill="none" stroke-linecap="round" stroke-width="16">
    <path d="M520 220 Q545 260 520 300" stroke="#3182F6"/>
    <path d="M565 190 Q605 260 565 330" stroke="#3182F6" opacity="0.7"/>
    <path d="M200 220 Q175 260 200 300" stroke="#3182F6"/>
    <path d="M155 190 Q115 260 155 330" stroke="#3182F6" opacity="0.7"/>
  </g>

  <!-- timeline card -->
  <rect x="660" y="190" width="460" height="300" rx="36" fill="#191F28" opacity="0.12"/>
  <rect x="640" y="170" width="460" height="300" rx="36" fill="#FFFFFF"/>
  <!-- active bars -->
  <g fill="#3182F6">
    <rect x="690" y="270" width="18" height="60" rx="9"/>
    <rect x="718" y="245" width="18" height="110" rx="9"/>
    <rect x="746" y="260" width="18" height="80" rx="9"/>
    <rect x="774" y="235" width="18" height="130" rx="9"/>
    <rect x="802" y="265" width="18" height="70" rx="9"/>
  </g>
  <!-- standby flat line -->
  <rect x="840" y="292" width="210" height="16" rx="8" fill="#3FB950"/>
  <!-- pause badge -->
  <circle cx="945" cy="230" r="34" fill="#3FB950"/>
  <rect x="931" y="214" width="9" height="32" rx="4" fill="#FFFFFF"/>
  <rect x="950" y="214" width="9" height="32" rx="4" fill="#FFFFFF"/>
  <!-- chips -->
  <rect x="680" y="385" width="170" height="54" rx="27" fill="#EAF3FF"/>
  <text x="765" y="421" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#1B64DA" text-anchor="middle">$0.05/min</text>
  <rect x="870" y="385" width="190" height="54" rx="27" fill="#E6F6EA"/>
  <text x="965" y="421" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#2B8A3E" text-anchor="middle">$0.02/min</text>

  <!-- small code chips -->
  <rect x="640" y="80" width="250" height="56" rx="28" fill="#191F28"/>
  <text x="765" y="117" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#FFFFFF" text-anchor="middle">gpt-live-1.1</text>
  <rect x="910" y="80" width="190" height="56" rx="28" fill="#F04452"/>
  <text x="1005" y="117" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−60% idle</text>

  <rect x="640" y="510" width="300" height="56" rx="28" fill="#FFFFFF"/>
  <text x="790" y="547" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#191F28" text-anchor="middle">idle 5–60s → standby</text>
</svg>
