  <text x="524" y="414" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="bold" fill="#1B64DA">auto-sync</text>
  <!-- memory warning row -->
  <rect x="476" y="450" width="348" height="70" rx="18" fill="#FFF0F1"/>
  <circle cx="510" cy="485" r="18" fill="#F04452"/>
  <rect x="507" y="472" width="6" height="16" rx="3" fill="#FFFFFF"/>
