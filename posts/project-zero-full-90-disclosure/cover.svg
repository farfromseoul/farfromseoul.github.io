<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="100" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="110" cy="610" r="170" fill="#FFFFFF" opacity="0.4"/>

  <!-- calendar -->
  <g transform="translate(150,150)">
    <rect x="14" y="20" width="400" height="380" rx="36" fill="#191F28" opacity="0.12"/>
    <rect x="0" y="0" width="400" height="380" rx="36" fill="#FFFFFF"/>
    <path d="M0 36 a36 36 0 0 1 36 -36 h328 a36 36 0 0 1 36 36 v64 h-400 z" fill="#3182F6"/>
    <rect x="90" y="-26" width="26" height="62" rx="13" fill="#191F28"/>
    <rect x="284" y="-26" width="26" height="62" rx="13" fill="#191F28"/>
    <text x="200" y="68" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">DAY</text>
    <text x="200" y="285" font-family="DejaVu Sans, sans-serif" font-size="170" font-weight="700" fill="#191F28" text-anchor="middle">90</text>
    <rect x="70" y="315" width="260" height="14" rx="7" fill="#D6E8FF"/>
    <rect x="70" y="315" width="260" height="14" rx="7" fill="#F04452"/>
  </g>

  <!-- unlocked padlock / disclosure -->
  <g transform="translate(720,210)">
    <rect x="12" y="132" width="250" height="210" rx="34" fill="#191F28" opacity="0.12"/>
    <path d="M60 120 V50 a65 65 0 0 1 130 0 V78" fill="none" stroke="#191F28" stroke-width="30" stroke-linecap="round" transform="translate(0,0)"/>
    <rect x="0" y="118" width="250" height="210" rx="34" fill="#1B64DA"/>
    <circle cx="125" cy="205" r="28" fill="#EAF3FF"/>
    <rect x="113" y="215" width="24" height="60" rx="12" fill="#EAF3FF"/>
  </g>

  <!-- chips -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="700">
    <rect x="620" y="80" width="250" height="60" rx="30" fill="#191F28"/>
    <text x="745" y="120" font-size="28" fill="#FFFFFF" text-anchor="middle">Full 90</text>

    <rect x="900" y="80" width="230" height="60" rx="30" fill="#FFFFFF"/>
    <text x="1015" y="120" font-size="26" fill="#1B64DA" text-anchor="middle">no grace</text>

    <rect x="620" y="580" width="400" height="60" rx="30" fill="#FFFFFF"/>
    <text x="820" y="620" font-size="28" fill="#191F28" text-anchor="middle">90 → 60 → 30</text>

    <rect x="1000" y="400" width="150" height="56" rx="28" fill="#3FB950"/>
    <text x="1075" y="437" font-size="24" fill="#FFFFFF" text-anchor="middle">patch</text>
  </g>
</svg>
