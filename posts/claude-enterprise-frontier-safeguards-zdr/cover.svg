<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3182F6"/>
      <stop offset="1" stop-color="#1B64DA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="120" cy="600" r="170" fill="#FFFFFF" opacity="0.3"/>

  <!-- request stream (left) -->
  <g>
    <rect x="96" y="214" width="250" height="64" rx="18" fill="#191F28" opacity="0.08" transform="translate(6,8)"/>
    <rect x="96" y="214" width="250" height="64" rx="18" fill="#FFFFFF"/>
    <circle cx="130" cy="246" r="12" fill="#3182F6"/>
    <rect x="156" y="238" width="160" height="16" rx="8" fill="#D6E8FF"/>

    <rect x="96" y="304" width="250" height="64" rx="18" fill="#191F28" opacity="0.08" transform="translate(6,8)"/>
    <rect x="96" y="304" width="250" height="64" rx="18" fill="#FFFFFF"/>
    <circle cx="130" cy="336" r="12" fill="#F04452"/>
    <rect x="156" y="328" width="130" height="16" rx="8" fill="#FFD9DD"/>

    <rect x="96" y="394" width="250" height="64" rx="18" fill="#191F28" opacity="0.08" transform="translate(6,8)"/>
    <rect x="96" y="394" width="250" height="64" rx="18" fill="#FFFFFF"/>
    <circle cx="130" cy="426" r="12" fill="#3182F6"/>
    <rect x="156" y="418" width="150" height="16" rx="8" fill="#D6E8FF"/>
  </g>

  <!-- arrows -->
  <path d="M370 336 H 450" stroke="#1B64DA" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M440 316 L 466 336 L 440 356" stroke="#1B64DA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- shield (center) -->
  <path d="M600 158 L 720 204 V 330 C 720 420 668 476 600 510 C 532 476 480 420 480 330 V 204 Z" fill="#191F28" opacity="0.1" transform="translate(8,12)"/>
  <path d="M600 158 L 720 204 V 330 C 720 420 668 476 600 510 C 532 476 480 420 480 330 V 204 Z" fill="url(#shield)"/>
  <path d="M600 196 L 690 230 V 330 C 690 400 652 446 600 474 C 548 446 510 400 510 330 V 230 Z" fill="#FFFFFF" opacity="0.15"/>
  <path d="M552 330 L 588 366 L 656 294" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- arrow to bucket -->
  <path d="M740 336 H 820" stroke="#1B64DA" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="2 20"/>
  <path d="M812 316 L 838 336 L 812 356" stroke="#1B64DA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- customer cloud bucket (right) -->
  <g>
    <path d="M880 250 H 1100 L 1080 470 C 1078 488 1064 500 1046 500 H 934 C 916 500 902 488 900 470 Z" fill="#191F28" opacity="0.1" transform="translate(8,12)"/>
    <path d="M880 250 H 1100 L 1080 470 C 1078 488 1064 500 1046 500 H 934 C 916 500 902 488 900 470 Z" fill="#FFFFFF"/>
    <ellipse cx="990" cy="250" rx="110" ry="28" fill="#D6E8FF"/>
    <ellipse cx="990" cy="250" rx="110" ry="28" fill="none" stroke="#3182F6" stroke-width="6"/>
    <!-- lock -->
    <rect x="946" y="350" width="88" height="76" rx="16" fill="#191F28"/>
    <path d="M962 352 V 330 C 962 312 974 300 990 300 C 1006 300 1018 312 1018 330 V 352" stroke="#191F28" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="990" cy="384" r="10" fill="#3FB950"/>
    <rect x="986" y="388" width="8" height="20" rx="4" fill="#3FB950"/>
  </g>

  <!-- chips -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="30">
    <rect x="96" y="120" width="170" height="56" rx="28" fill="#191F28"/>
    <text x="181" y="158" text-anchor="middle" fill="#FFFFFF">ZDR</text>

    <rect x="480" y="560" width="240" height="56" rx="28" fill="#3FB950"/>
    <text x="600" y="598" text-anchor="middle" fill="#FFFFFF">auto scan</text>

    <rect x="900" y="540" width="180" height="56" rx="28" fill="#3182F6"/>
    <text x="990" y="578" text-anchor="middle" fill="#FFFFFF">SIEM</text>

    <rect x="900" y="150" width="190" height="52" rx="26" fill="#FFFFFF"/>
    <text x="995" y="185" text-anchor="middle" fill="#1B64DA" font-size="26">your key</text>
  </g>
</svg>
