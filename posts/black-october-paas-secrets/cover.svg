<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="100" r="150" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="110" cy="610" r="170" fill="#FFFFFF" opacity="0.3"/>

  <!-- calendar chip -->
  <rect x="96" y="86" width="150" height="150" rx="28" fill="#191F28" opacity="0.10"/>
  <rect x="80" y="70" width="150" height="150" rx="28" fill="#FFFFFF"/>
  <rect x="80" y="70" width="150" height="46" rx="23" fill="#F04452"/>
  <rect x="80" y="96" width="150" height="20" fill="#F04452"/>
  <text x="155" y="104" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#FFFFFF">OCT</text>
  <text x="155" y="190" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" fill="#191F28">×9</text>

  <!-- platform box with env panel -->
  <rect x="306" y="186" width="400" height="360" rx="36" fill="#191F28" opacity="0.10"/>
  <rect x="290" y="160" width="400" height="360" rx="36" fill="#191F28"/>
  <circle cx="330" cy="196" r="9" fill="#F04452"/>
  <circle cx="358" cy="196" r="9" fill="#FFC542"/>
  <circle cx="386" cy="196" r="9" fill="#3FB950"/>
  <text x="650" y="204" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#8FB8FF">.env</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="26">
    <text x="322" y="268" fill="#8FB8FF">AI_API_KEY=</text><text x="512" y="268" fill="#F04452">sk-••••</text>
    <text x="322" y="322" fill="#8FB8FF">DB_PASSWORD=</text><text x="528" y="322" fill="#F04452">••••••</text>
    <text x="322" y="376" fill="#8FB8FF">PAY_KEY=</text><text x="464" y="376" fill="#F04452">rk_•••</text>
    <text x="322" y="430" fill="#8FB8FF">AWS_SECRET=</text><text x="512" y="430" fill="#F04452">••••••</text>
  </g>
  <rect x="322" y="456" width="200" height="12" rx="6" fill="#3182F6" opacity="0.6"/>

  <!-- open padlock on the box -->
  <path d="M640 420 L640 380 A34 34 0 0 1 708 380" fill="none" stroke="#1B64DA" stroke-width="14" stroke-linecap="round"/>
  <rect x="616" y="420" width="110" height="92" rx="20" fill="#3182F6"/>
  <circle cx="671" cy="456" r="11" fill="#191F28"/>
  <rect x="666" y="460" width="10" height="26" rx="5" fill="#191F28"/>

  <!-- key flying out -->
  <g transform="translate(770 250) rotate(-18)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#F04452" stroke-width="12"/>
    <rect x="30" y="-8" width="110" height="16" rx="8" fill="#F04452"/>
    <rect x="104" y="6" width="14" height="26" rx="5" fill="#F04452"/>
    <rect x="124" y="6" width="14" height="20" rx="5" fill="#F04452"/>
  </g>
  <path d="M720 300 Q 740 280 752 268" stroke="#F04452" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" fill="none"/>

  <!-- usage spike card -->
  <rect x="806" y="356" width="320" height="230" rx="30" fill="#191F28" opacity="0.10"/>
  <rect x="790" y="330" width="320" height="230" rx="30" fill="#FFFFFF"/>
  <text x="818" y="378" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#191F28">API calls</text>
  <rect x="826" y="486" width="28" height="40" rx="8" fill="#D6E8FF"/>
  <rect x="866" y="494" width="28" height="32" rx="8" fill="#D6E8FF"/>
  <rect x="906" y="482" width="28" height="44" rx="8" fill="#D6E8FF"/>
  <rect x="946" y="450" width="28" height="76" rx="8" fill="#3182F6"/>
  <rect x="986" y="408" width="28" height="118" rx="8" fill="#F04452"/>
  <rect x="1026" y="396" width="28" height="130" rx="8" fill="#F04452"/>
  <rect x="958" y="352" width="132" height="40" rx="20" fill="#F04452"/>
  <text x="1024" y="379" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#FFFFFF">1.7M ↑</text>

  <!-- rotate + revoke chip -->
  <rect x="306" y="576" width="400" height="64" rx="32" fill="#191F28" opacity="0.10"/>
  <rect x="290" y="560" width="400" height="64" rx="32" fill="#3FB950"/>
  <text x="490" y="602" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">revoke → rotate</text>

  <!-- 30 min chip -->
  <rect x="876" y="156" width="200" height="60" rx="30" fill="#191F28" opacity="0.10"/>
  <rect x="860" y="140" width="200" height="60" rx="30" fill="#1B64DA"/>
  <text x="960" y="180" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#FFFFFF">⏱ 30 min</text>
</svg>
