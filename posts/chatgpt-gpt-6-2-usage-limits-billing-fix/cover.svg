<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="70" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="120" cy="590" r="90" fill="#FFFFFF" opacity="0.45"/>

  <!-- gauge card -->
  <rect x="148" y="138" width="520" height="420" rx="40" fill="#191F28" opacity="0.12"/>
  <rect x="136" y="124" width="520" height="420" rx="40" fill="#FFFFFF"/>
  <text x="180" y="190" font-family="Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#191F28">USAGE</text>
  <rect x="520" y="160" width="100" height="40" rx="20" fill="#EAF3FF"/>
  <text x="570" y="188" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="22" font-weight="700" fill="#1B64DA">5h</text>
  <!-- gauge arc -->
  <path d="M 216 430 A 180 180 0 0 1 576 430" fill="none" stroke="#E5ECF6" stroke-width="44" stroke-linecap="round"/>
  <path d="M 216 430 A 180 180 0 0 1 486 274" fill="none" stroke="#3182F6" stroke-width="44" stroke-linecap="round"/>
  <path d="M 486 274 A 180 180 0 0 1 560 360" fill="none" stroke="#F04452" stroke-width="44" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="396" y1="430" x2="530" y2="320" stroke="#191F28" stroke-width="12" stroke-linecap="round"/>
  <circle cx="396" cy="430" r="22" fill="#191F28"/>
  <text x="396" y="512" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="44" font-weight="700" fill="#191F28">LIMIT</text>

  <!-- chips -->
  <rect x="742" y="152" width="330" height="96" rx="48" fill="#191F28" opacity="0.12"/>
  <rect x="732" y="140" width="330" height="96" rx="48" fill="#F04452"/>
  <text x="897" y="203" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="40" font-weight="700" fill="#FFFFFF">Astra +40%</text>

  <rect x="742" y="282" width="330" height="96" rx="48" fill="#191F28" opacity="0.12"/>
  <rect x="732" y="270" width="330" height="96" rx="48" fill="#1B64DA"/>
  <text x="897" y="333" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="40" font-weight="700" fill="#FFFFFF">Sol +25%</text>

  <!-- reset button -->
  <rect x="742" y="412" width="330" height="96" rx="48" fill="#191F28" opacity="0.12"/>
  <rect x="732" y="400" width="330" height="96" rx="48" fill="#FFFFFF"/>
  <circle cx="800" cy="448" r="30" fill="#3FB950"/>
  <path d="M 788 440 A 14 14 0 1 1 790 458" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 780 432 L 788 442 L 798 434" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="945" y="461" text-anchor="middle" font-family="Noto Sans Mono, monospace" font-size="34" font-weight="700" fill="#191F28">reset ×1</text>

  <!-- shared bar -->
  <rect x="136" y="590" width="926" height="34" rx="17" fill="#FFFFFF"/>
  <rect x="136" y="590" width="330" height="34" rx="17" fill="#3182F6"/>
  <rect x="440" y="590" width="260" height="34" fill="#1B64DA"/>
  <rect x="680" y="590" width="40" height="34" rx="0" fill="#1B64DA"/>
  <text x="1080" y="616" font-family="Noto Sans Mono, monospace" font-size="24" font-weight="700" fill="#191F28">Dec</text>
</svg>
