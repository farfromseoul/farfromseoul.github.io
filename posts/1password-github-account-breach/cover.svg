    <rect x="602" y="258" width="16" height="22" rx="4"/><rect x="602" y="352" width="16" height="22" rx="4"/>
    <rect x="552" y="308" width="22" height="16" rx="4"/><rect x="646" y="308" width="22" height="16" rx="4"/>
  </g>
  <text x="610" y="408" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CI/CD</text>

  <!-- server -->
  <rect x="898" y="218" width="200" height="250" rx="32" fill="#191F28" opacity="0.10"/>
  <rect x="890" y="206" width="200" height="250" rx="32" fill="#FFFFFF"/>
  <rect x="918" y="236" width="144" height="52" rx="14" fill="#EAF3FF"/>
