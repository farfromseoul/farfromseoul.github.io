<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="120" cy="600" r="170" fill="#FFFFFF" opacity="0.3"/>

  <!-- record cards stack (left) -->
  <g>
    <rect x="96" y="226" width="220" height="140" rx="20" fill="#191F28" opacity="0.10"/>
    <rect x="80" y="196" width="220" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="104" y="222" width="44" height="44" rx="22" fill="#D6E8FF"/>
    <rect x="164" y="228" width="110" height="12" rx="6" fill="#191F28"/>
    <rect x="164" y="250" width="80" height="10" rx="5" fill="#B0C4DE"/>
    <rect x="104" y="288" width="170" height="10" rx="5" fill="#B0C4DE"/>
    <rect x="104" y="308" width="120" height="10" rx="5" fill="#B0C4DE"/>
  </g>
  <g>
    <rect x="76" y="396" width="220" height="140" rx="20" fill="#191F28" opacity="0.10"/>
    <rect x="60" y="366" width="220" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="84" y="392" width="44" height="44" rx="22" fill="#FFE1E4"/>
    <rect x="144" y="398" width="110" height="12" rx="6" fill="#191F28"/>
    <rect x="144" y="420" width="70" height="10" rx="5" fill="#B0C4DE"/>
    <rect x="84" y="458" width="170" height="10" rx="5" fill="#B0C4DE"/>
    <rect x="84" y="478" width="100" height="10" rx="5" fill="#B0C4DE"/>
  </g>

  <!-- arrow to gauge -->
  <path d="M320 350 L390 350" stroke="#3182F6" stroke-width="12" stroke-linecap="round"/>
  <path d="M384 330 L410 350 L384 370 Z" fill="#3182F6"/>

  <!-- confidence gauge (center) -->
  <rect x="446" y="196" width="320" height="300" rx="32" fill="#191F28" opacity="0.10"/>
  <rect x="430" y="170" width="320" height="300" rx="32" fill="#FFFFFF"/>
  
  <!-- low (0-30%) green, mid (30-90%) blue band, high green -->
  <path d="M480.0 380.0 A110 110 0 0 1 525.3 291.0" fill="none" stroke="#3FB950" stroke-width="34"/>
  <path d="M525.3 291.0 A110 110 0 0 1 694.6 346.0" fill="none" stroke="#3182F6" stroke-width="34"/>
  <path d="M694.6 346.0 A110 110 0 0 1 700.0 380.0" fill="none" stroke="#3FB950" stroke-width="34"/>
  <!-- needle -->
  <line x1="590" y1="380" x2="581.7" y2="292.4" stroke="#191F28" stroke-width="10" stroke-linecap="round"/>
  <circle cx="590" cy="380" r="16" fill="#191F28"/>
  <rect x="520" y="414" width="140" height="36" rx="18" fill="#EAF3FF"/>
  <text x="590" y="439" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="bold" fill="#1B64DA" text-anchor="middle">p = 0.47</text>
  <text x="590" y="222" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#191F28" text-anchor="middle">confidence</text>

  <!-- escalate arrow -->
  <path d="M770 320 L850 320" stroke="#1B64DA" stroke-width="12" stroke-linecap="round"/>
  <path d="M844 300 L870 320 L844 340 Z" fill="#1B64DA"/>

  <!-- strong model box (right) -->
  <rect x="906" y="226" width="220" height="220" rx="32" fill="#191F28" opacity="0.12"/>
  <rect x="890" y="200" width="220" height="220" rx="32" fill="#1B64DA"/>
  <rect x="922" y="236" width="156" height="34" rx="12" fill="#3182F6"/>
  <rect x="922" y="284" width="156" height="34" rx="12" fill="#3182F6"/>
  <rect x="922" y="332" width="156" height="34" rx="12" fill="#3182F6"/>
  <circle cx="946" cy="253" r="7" fill="#3FB950"/>
  <circle cx="946" cy="301" r="7" fill="#3FB950"/>
  <circle cx="946" cy="349" r="7" fill="#3FB950"/>
  <rect x="964" y="248" width="90" height="10" rx="5" fill="#D6E8FF"/>
  <rect x="964" y="296" width="70" height="10" rx="5" fill="#D6E8FF"/>
  <rect x="964" y="344" width="80" height="10" rx="5" fill="#D6E8FF"/>
  <text x="1000" y="400" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">strong model</text>

  <!-- chips -->
  <rect x="840" y="470" width="310" height="56" rx="28" fill="#191F28"/>
  <text x="995" y="506" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">only 22% escalated</text>
  <rect x="450" y="520" width="300" height="56" rx="28" fill="#FFFFFF"/>
  <text x="600" y="557" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#191F28" text-anchor="middle">if 0.3 ≤ p ≤ 0.9</text>
  <rect x="880" y="548" width="230" height="56" rx="28" fill="#F04452"/>
  <text x="995" y="585" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">cost ÷ 4.4</text>
  <rect x="80" y="90" width="300" height="56" rx="28" fill="#3182F6"/>
  <text x="230" y="127" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">same person?</text>
</svg>
