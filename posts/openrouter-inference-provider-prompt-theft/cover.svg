<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="120" cy="600" r="170" fill="#FFFFFF" opacity="0.4"/>

  <!-- left: prompt bubble (laptop window) -->
  <rect x="98" y="198" width="340" height="250" rx="28" fill="#191F28" opacity="0.12"/>
  <rect x="88" y="186" width="340" height="250" rx="28" fill="#FFFFFF"/>
  <rect x="88" y="186" width="340" height="52" rx="28" fill="#3182F6"/>
  <rect x="88" y="212" width="340" height="26" fill="#3182F6"/>
  <circle cx="122" cy="212" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="148" cy="212" r="8" fill="#FFFFFF" opacity="0.6"/>
  <text x="188" y="220" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#FFFFFF" font-weight="bold">prompt</text>
  <rect x="118" y="264" width="240" height="16" rx="8" fill="#D6E8FF"/>
  <rect x="118" y="296" width="190" height="16" rx="8" fill="#D6E8FF"/>
  <rect x="112" y="330" width="290" height="44" rx="14" fill="#FDECEE"/>
  <text x="128" y="360" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#F04452" font-weight="bold">AWS_KEY=AKIA••••</text>
  <rect x="118" y="394" width="150" height="16" rx="8" fill="#D6E8FF"/>

  <!-- arrow path through router -->
  <path d="M432 310 C 500 310, 520 330, 560 330" stroke="#1B64DA" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- middle: router hub -->
  <circle cx="610" cy="340" r="66" fill="#191F28" opacity="0.12" transform="translate(8 10)"/>
  <circle cx="610" cy="340" r="66" fill="#1B64DA"/>
  <circle cx="610" cy="340" r="30" fill="#FFFFFF"/>
  <circle cx="610" cy="340" r="12" fill="#3182F6"/>
  <rect x="540" y="425" width="140" height="40" rx="20" fill="#FFFFFF"/>
  <text x="610" y="452" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#191F28" font-weight="bold">router</text>

  <!-- branches to providers -->
  <path d="M676 320 C 740 300, 760 200, 830 190" stroke="#3182F6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M676 340 L 830 340" stroke="#3182F6" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M676 360 C 740 380, 760 480, 830 490" stroke="#3182F6" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- provider servers -->
  <g>
    <rect x="842" y="148" width="190" height="88" rx="22" fill="#191F28" opacity="0.12"/>
    <rect x="834" y="140" width="190" height="88" rx="22" fill="#FFFFFF"/>
    <rect x="858" y="166" width="90" height="12" rx="6" fill="#D6E8FF"/>
    <rect x="858" y="192" width="60" height="12" rx="6" fill="#D6E8FF"/>
    <circle cx="990" cy="184" r="14" fill="#3FB950"/>
  </g>
  <g>
    <rect x="842" y="304" width="190" height="88" rx="22" fill="#191F28" opacity="0.12"/>
    <rect x="834" y="296" width="190" height="88" rx="22" fill="#FFFFFF" stroke="#F04452" stroke-width="5"/>
    <rect x="858" y="322" width="90" height="12" rx="6" fill="#FDECEE"/>
    <rect x="858" y="348" width="60" height="12" rx="6" fill="#FDECEE"/>
    <circle cx="990" cy="340" r="14" fill="#F04452"/>
  </g>
  <g>
    <rect x="842" y="454" width="190" height="88" rx="22" fill="#191F28" opacity="0.12"/>
    <rect x="834" y="446" width="190" height="88" rx="22" fill="#FFFFFF"/>
    <rect x="858" y="472" width="90" height="12" rx="6" fill="#D6E8FF"/>
    <rect x="858" y="498" width="60" height="12" rx="6" fill="#D6E8FF"/>
    <circle cx="990" cy="490" r="14" fill="#3FB950"/>
  </g>

  <!-- leak: key escaping from breached server -->
  <path d="M1024 330 C 1070 320, 1090 290, 1100 262" stroke="#F04452" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="4 14"/>
  <g transform="translate(1100 250) rotate(-30)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F04452" stroke-width="10"/>
    <rect x="18" y="-5" width="52" height="10" rx="5" fill="#F04452"/>
    <rect x="52" y="0" width="10" height="20" rx="4" fill="#F04452"/>
  </g>

  <!-- chips -->
  <rect x="88" y="490" width="236" height="56" rx="28" fill="#191F28"/>
  <text x="206" y="527" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#FFFFFF" font-weight="bold">ZDR: true ?</text>
  <rect x="344" y="490" width="200" height="56" rx="28" fill="#FFFFFF"/>
  <text x="444" y="527" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#1B64DA" font-weight="bold">125 → off</text>
  <rect x="88" y="90" width="220" height="56" rx="28" fill="#FFFFFF"/>
  <text x="198" y="127" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#191F28" font-weight="bold">~2M canary</text>
</svg>
