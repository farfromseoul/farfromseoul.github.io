<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="140" fill="#3182F6" opacity="0.08"/>
  <circle cx="120" cy="600" r="160" fill="#1B64DA" opacity="0.07"/>

  <!-- PR document card -->
  <rect x="98" y="168" width="300" height="380" rx="32" fill="#191F28" opacity="0.12"/>
  <rect x="86" y="152" width="300" height="380" rx="32" fill="#FFFFFF"/>
  <!-- branch icon -->
  <g stroke="#3182F6" stroke-width="10" fill="none" stroke-linecap="round">
    <line x1="146" y1="218" x2="146" y2="300"/>
    <path d="M146 300 C146 260 226 270 226 228"/>
  </g>
  <circle cx="146" cy="212" r="16" fill="#FFFFFF" stroke="#3182F6" stroke-width="9"/>
  <circle cx="146" cy="306" r="16" fill="#FFFFFF" stroke="#3182F6" stroke-width="9"/>
  <circle cx="226" cy="220" r="16" fill="#FFFFFF" stroke="#1B64DA" stroke-width="9"/>
  <text x="262" y="232" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="bold" fill="#191F28">PR</text>
  <!-- diff lines -->
  <rect x="122" y="350" width="228" height="22" rx="11" fill="#3FB950" opacity="0.35"/>
  <rect x="122" y="386" width="180" height="22" rx="11" fill="#F04452" opacity="0.3"/>
  <rect x="122" y="422" width="210" height="22" rx="11" fill="#3FB950" opacity="0.35"/>
  <rect x="122" y="458" width="150" height="22" rx="11" fill="#D6E8FF"/>

  <!-- pipeline arrow -->
  <path d="M410 342 L470 342" stroke="#1B64DA" stroke-width="10" stroke-linecap="round"/>

  <!-- stage 1: review -->
  <rect x="498" y="250" width="180" height="180" rx="36" fill="#191F28" opacity="0.12" transform="translate(10 12)"/>
  <rect x="498" y="250" width="180" height="180" rx="36" fill="#3182F6"/>
  <circle cx="578" cy="330" r="38" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <line x1="606" y1="358" x2="636" y2="388" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <path d="M690 342 L740 342" stroke="#1B64DA" stroke-width="10" stroke-linecap="round"/>

  <!-- stage 2: fix (wrench) -->
  <rect x="758" y="250" width="180" height="180" rx="36" fill="#191F28" opacity="0.12" transform="translate(10 12)"/>
  <rect x="758" y="250" width="180" height="180" rx="36" fill="#1B64DA"/>
  <g transform="translate(848 340) rotate(-45)">
    <rect x="-12" y="-10" width="24" height="80" rx="12" fill="#FFFFFF"/>
    <path d="M-34 -40 A36 36 0 1 0 34 -40 L14 -40 L14 -18 L-14 -18 L-14 -40 Z" fill="#FFFFFF"/>
  </g>

  <path d="M950 342 L1000 342" stroke="#1B64DA" stroke-width="10" stroke-linecap="round"/>

  <!-- stage 3: approve -->
  <circle cx="1078" cy="352" r="82" fill="#191F28" opacity="0.12"/>
  <circle cx="1070" cy="340" r="82" fill="#3FB950"/>
  <path d="M1030 342 L1060 372 L1112 314" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chips -->
  <rect x="498" y="476" width="190" height="64" rx="32" fill="#191F28"/>
  <text x="593" y="518" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="bold" fill="#FFFFFF">/ship</text>
  <rect x="712" y="476" width="250" height="64" rx="32" fill="#FFFFFF"/>
  <text x="837" y="518" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#191F28">policy.ok?</text>
  <rect x="986" y="476" width="150" height="64" rx="32" fill="#F04452"/>
  <text x="1061" y="518" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="bold" fill="#FFFFFF">beta</text>

  <!-- top label chips -->
  <rect x="498" y="150" width="300" height="60" rx="30" fill="#FFFFFF"/>
  <text x="648" y="190" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="bold" fill="#3182F6">review→fix→ok</text>
</svg>
