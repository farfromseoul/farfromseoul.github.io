    <circle cx="676" cy="229" r="15" fill="none" stroke="#B0C4DE" stroke-width="4"/>
    <circle cx="722" cy="229" r="15" fill="none" stroke="#B0C4DE" stroke-width="4"/>

    <rect x="500" y="282" width="90" height="14" rx="7" fill="#191F28"/>
    <circle cx="630" cy="289" r="15" fill="none" stroke="#B0C4DE" stroke-width="4"/>
    <circle cx="676" cy="289" r="17" fill="#3182F6"/>
    <circle cx="722" cy="289" r="15" fill="none" stroke="#B0C4DE" stroke-width="4"/>

    <rect x="500" y="342" width="80" height="14" rx="7" fill="#B0C4DE"/>
