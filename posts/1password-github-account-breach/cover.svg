  <path d="M300 340 C 420 340, 440 340, 520 340" stroke="#F04452" stroke-width="10" stroke-dasharray="6 18" stroke-linecap="round" fill="none"/>
  <path d="M700 340 C 780 340, 800 340, 880 340" stroke="#F04452" stroke-width="10" stroke-dasharray="6 18" stroke-linecap="round" fill="none"/>

